version: '3.9'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kinkeep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kinkeep_db}
      POSTGRES_USER: ${DB_USER:-kinkeep_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kinkeep_secure_dev_password_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kinkeep_admin} -d ${DB_NAME:-kinkeep_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 In-Memory Store & Celery Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: kinkeep_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO Local S3-Compatible Object Storage
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: kinkeep_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # MinIO S3 API
      - "9001:9001" # MinIO Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kinkeep_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kinkeep_minio_dev_password_2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO Bucket Auto-Provisioner
  # ----------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: kinkeep_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-kinkeep_minio_admin} ${MINIO_ROOT_PASSWORD:-kinkeep_minio_dev_password_2026};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-kinkeep-private-media};
      /usr/bin/mc anonymous set none local/${MINIO_BUCKET_NAME:-kinkeep-private-media};
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
